# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: Rubenbot1404/guerraguzman-web
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/f6bc0a30-cd18-4dee-811e-5b2238f49143/pkce
  auth_token_endpoint: /sites/f6bc0a30-cd18-4dee-811e-5b2238f49143/token
  gateway_url: https://gateway.decapbridge.com
  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://guerraguzman.cl

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "Propiedades"
    label: "Propiedades"
    files:
      - name: "listado"
        label: "Listado de propiedades"
        file: "data/propiedades.json"
        fields:
          - label: "Propiedades"
            name: "propiedades"
            widget: "list"
            label_singular: "propiedad"
            summary: "{{fields.titulo}} — {{fields.comuna}}"
            fields:

              - label: "ID (único, sin espacios ni tildes)"
                name: "id"
                widget: "string"
                hint: "Ej: depto-603-plaza-buzeta-cerrillos. Solo minúsculas, números y guiones."
                pattern:
                  - "^[a-z0-9]+(-[a-z0-9]+)*$"
                  - "Usa solo minúsculas, números y guiones. Sin espacios, tildes ni mayúsculas."

              - label: "Título"
                name: "titulo"
                widget: "string"

              - label: "Operación"
                name: "operacion"
                widget: "select"
                options: ["Arriendo", "Venta"]

              - label: "Tipo"
                name: "tipo"
                widget: "select"
                options: ["Departamento", "Casa", "Oficina", "Local comercial"]

              - label: "Comuna"
                name: "comuna"
                widget: "string"

              - label: "Dirección"
                name: "direccion"
                widget: "string"
                required: false

              - label: "Moneda del precio"
                name: "moneda"
                widget: "select"
                options: ["UF", "CLP"]
                default: "UF"
                hint: "Arriendos normalmente en CLP. Ventas normalmente en UF."

              - label: "Precio (en la moneda elegida arriba)"
                name: "precioUF"
                widget: "number"
                value_type: "float"
                step: 0.01
                hint: "Sin puntos de miles. Ej: 400000 para $400.000, o 4500 para UF 4.500."

              - label: "Dormitorios"
                name: "dorm"
                widget: "number"
                value_type: "int"
                required: false

              - label: "Baños"
                name: "banos"
                widget: "number"
                value_type: "int"

              - label: "m² (para la tarjeta de listado)"
                name: "m2"
                widget: "number"
                value_type: "float"
                step: 0.01
                hint: "Escribe con PUNTO, no coma. Ej: 38.5 — la página lo muestra como 38,5 m²."

              - label: "Superficie útil (m²)"
                name: "superficieUtil"
                widget: "number"
                value_type: "float"
                step: 0.01
                required: false
                hint: "Escribe con PUNTO. Ej: 35.42"

              - label: "Superficie total (m²)"
                name: "superficieTotal"
                widget: "number"
                value_type: "float"
                step: 0.01
                required: false
                hint: "Escribe con PUNTO. Ej: 38.5"

              - label: "Estacionamientos"
                name: "estacionamientos"
                widget: "number"
                value_type: "int"
                required: false

              - label: "Bodegas"
                name: "bodegas"
                widget: "number"
                value_type: "int"
                required: false

              - label: "Gastos comunes (CLP)"
                name: "gastosComunes"
                widget: "number"
                value_type: "int"
                required: false

              - label: "Contribuciones (CLP)"
                name: "contribuciones"
                widget: "number"
                value_type: "int"
                required: false

              - label: "Rol"
                name: "rol"
                widget: "string"
                required: false

              - label: "Estado"
                name: "estado"
                widget: "select"
                options: ["Disponible", "Reservado", "Arrendado", "Vendido"]
                default: "Disponible"
                required: false

              - label: "Descripción"
                name: "descripcion"
                widget: "text"
                required: false

              - label: "Características"
                name: "caracteristicas"
                widget: "list"
                required: false
                field: { label: "Característica", name: "caracteristica", widget: "string" }

              - label: "Fotos"
                name: "fotos"
                widget: "list"
                required: false
                hint: "Solo imágenes (jpg, png, webp). El plano en PDF va en su propio campo más abajo."
                field: { label: "Foto", name: "foto", widget: "image" }

              - label: "Video (link de YouTube o Vimeo)"
                name: "video"
                widget: "string"
                required: false

              - label: "Tour virtual (URL)"
                name: "tourVirtual"
                widget: "string"
                required: false

              - label: "Plano (PDF)"
                name: "planoPdf"
                widget: "file"
                required: false

              - label: "Latitud"
                name: "lat"
                widget: "number"
                value_type: "float"
                step: 0.000001
                required: false
                hint: "Con PUNTO y todos los decimales. Ej: -33.503012"

              - label: "Longitud"
                name: "lng"
                widget: "number"
                value_type: "float"
                step: 0.000001
                required: false
                hint: "Con PUNTO y todos los decimales. Ej: -70.717845"

name: Marca de agua en fotos

on:
  push:
    branches: [main]
    paths:
      - 'images/uploads/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  watermark:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[watermark]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Pillow
        run: pip install Pillow

      - name: Aplicar marca de agua a fotos nuevas
        run: python scripts/watermark.py

      - name: Guardar cambios si hubo fotos nuevas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/uploads
          git diff --cached --quiet || git commit -m "Auto: marca de agua en fotos nuevas [watermark]"
          git push
